name: Release CLI

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check version and prepare archive
        run: |
          test "$GITHUB_REF_NAME" = "v$(node cli.mjs --version)"
          npm pack --ignore-scripts
          shasum -a 256 feishu-doc-grabber-*.tgz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" feishu-doc-grabber-*.tgz SHA256SUMS \
            --verify-tag --title "Feishu Grabber $GITHUB_REF_NAME" --notes-file CHANGELOG.md
